<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scry Explorer</title>
    <!-- Base href is rewritten at serve time to the route MapScryExplorer is mounted under. -->
    <base href="__SCRY_BASE__" />
    <!-- Resolves against the base above, so the icon is served from the explorer's own route. -->
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link href="css/app.css" rel="stylesheet" />
    <link href="css/shell.css" rel="stylesheet" />
    <link href="css/panes.css" rel="stylesheet" />
    <link href="_content/BlazorMonaco/lib/monaco-editor/min/vs/editor/editor.main.css" rel="stylesheet" />
    <!-- Apply the saved theme before first paint so the loading screen doesn't flash light in dark mode. -->
    <script>
        (function () {
            try { document.documentElement.dataset.theme = localStorage.getItem('scry-theme') || 'system'; } catch (e) { }
        })();
    </script>
</head>
<body>
    <div id="app">
        <div class="loading">
            <p class="loading-message">Loading Scry Explorer…</p>
            <!-- Rewritten at serve time to the build the package is (ExplorerAssets.Version). -->
            <p class="loading-version">__SCRY_VERSION__</p>
            <p class="loading-error" hidden></p>
        </div>
    </div>
    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
    </div>
    <script src="_content/BlazorMonaco/jsInterop.js"></script>
    <script src="_content/BlazorMonaco/lib/monaco-editor/min/vs/loader.js"></script>
    <script src="_content/BlazorMonaco/lib/monaco-editor/min/vs/editor/editor.main.js"></script>
    <script src="js/scry.js"></script>
    <script src="_framework/blazor.webassembly.js" autostart="false"></script>
    <!--
        Blazor is started by hand, once Monaco is actually there. The script tag above only *registers*
        editor.main.js with the AMD loader; the loader then fetches the bundle's chunks and publishes
        window.monaco some time later. Blazor's own boot races that, and the editor component calls
        monaco.editor.create the moment it first renders — so whichever finishes second decides whether
        the explorer gets an editor at all. On a cold load the WASM download (Roslyn included) is far
        slower and Monaco always wins; on a reload every asset is cached, Blazor wins, and the editor
        silently never mounts ("BlazorMonaco: monaco is undefined"). Requiring the module before
        starting Blazor removes the race in both directions. The errorback still starts the app if
        Monaco genuinely fails to load, so that arrives as the explorer's own visible error rather than
        as a permanent "Loading Scry Explorer…".

        A boot that fails, or a browser without WebAssembly, is written on the loading screen in place of
        the spinner: otherwise it is only in the console, and the page looks like it is still loading.
        Once the app has rendered the loading screen is gone, and the listeners write nothing.
    -->
    <script>
        (() => {
            const loading = document.querySelector('#app .loading');
            const fail = reason => {
                if (!loading.isConnected) {
                    return;
                }

                loading.classList.add('failed');
                loading.querySelector('.loading-message').textContent = 'Scry Explorer could not start';
                const error = loading.querySelector('.loading-error');
                error.textContent = String(reason?.message ?? reason ?? 'Unknown error');
                error.hidden = false;
            };
            addEventListener('error', event => fail(event.error ?? event.message));
            addEventListener('unhandledrejection', event => fail(event.reason));

            if (typeof WebAssembly !== 'object') {
                fail('This browser has WebAssembly turned off, and Scry Explorer runs on it. On an iPhone or iPad, Lockdown Mode turns it off.');
                return;
            }

            // A base href that is not where the page is mounted sends every request below it to a 404,
            // and the first sign is that the scripts above never ran. Saying which address failed is
            // what makes that plain.
            if (typeof Blazor !== 'object') {
                fail(`${new URL('_framework/blazor.webassembly.js', document.baseURI)} did not load.`);
                return;
            }

            const start = () => Blazor.start().catch(fail);
            if (typeof require !== 'function') {
                start();
                return;
            }

            require(['vs/editor/editor.main'], start, start);
        })();
    </script>
</body>
</html>
