image: Visual Studio 2022
environment:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
build_script:
- appveyor DownloadFile https://dot.net/v1/dotnet-install.ps1
- pwsh: ./dotnet-install.ps1 -JSonFile global.json -Architecture x64 -InstallDir 'C:\Program Files\dotnet'
- dotnet build src/Scry.slnx --configuration Release
- dotnet build IntegrationTests/IntegrationTests.slnx --configuration Release -p:GeneratePackageOnBuild=false
- dotnet build samples/Scry.Samples.slnx --configuration Release -p:GeneratePackageOnBuild=false
- dotnet test src/Scry.slnx --configuration Release --no-build
- dotnet test IntegrationTests/IntegrationTests.slnx --configuration Release --no-build
# Includes the headless-browser tests; VerifyPlaywright.Initialize(installPlaywright:true) fetches Chromium.
- dotnet test samples/Scry.Samples.slnx --configuration Release --no-build
on_failure:
  - ps: |
      $root = (Get-Location).Path
      Get-ChildItem *.received.* -Recurse | % {
        $rel = $_.FullName.Substring($root.Length + 1)
        Push-AppveyorArtifact $_.FullName -FileName $rel
      }
test: off
artifacts:
- path: nugets\*.nupkg
