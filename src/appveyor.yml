image: Visual Studio 2022
environment:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
build_script:
- appveyor DownloadFile https://dot.net/v1/dotnet-install.ps1
- pwsh: ./dotnet-install.ps1 -JSonFile global.json -Architecture x64 -InstallDir 'C:\Program Files\dotnet'
- dotnet build src/Scry.slnx --configuration Release
- dotnet build IntegrationTests/IntegrationTests.slnx --configuration Release -p:GeneratePackageOnBuild=false
- dotnet build samples/Scry.Samples.slnx --configuration Release -p:GeneratePackageOnBuild=false
- pwsh: |
    # All three suites run before reporting, so one failing suite does not hide the results of
    # the others, and the trx from every suite is uploaded even when an earlier one fails.
    $testExit = 0
    dotnet test src/Scry.slnx --configuration Release --no-build --logger trx
    if ($LASTEXITCODE -ne 0) { $testExit = $LASTEXITCODE }
    dotnet test IntegrationTests/IntegrationTests.slnx --configuration Release --no-build --logger trx
    if ($LASTEXITCODE -ne 0) { $testExit = $LASTEXITCODE }
    # Includes the headless-browser tests; VerifyPlaywright.Initialize(installPlaywright:true) fetches Chromium.
    dotnet test samples/Scry.Samples.slnx --configuration Release --no-build --logger trx
    if ($LASTEXITCODE -ne 0) { $testExit = $LASTEXITCODE }
    $url = "https://ci.appveyor.com/api/testresults/mstest/$($env:APPVEYOR_JOB_ID)"
    Get-ChildItem -Recurse -Filter *.trx | ForEach-Object {
      Write-Host "Uploading test results: $($_.FullName)"
      try { (New-Object System.Net.WebClient).UploadFile($url, $_.FullName) }
      catch { Write-Host "Failed to upload test results: $_" }
    }
    if ($testExit -ne 0) { exit $testExit }
on_failure:
  - ps: |
      $root = (Get-Location).Path
      Get-ChildItem *.received.* -Recurse | % {
        $rel = $_.FullName.Substring($root.Length + 1)
        Push-AppveyorArtifact $_.FullName -FileName $rel
      }
test: off
artifacts:
- path: nugets\*.nupkg
