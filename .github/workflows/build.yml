name: Build

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  workflow_dispatch:

# Read only by default. The publish job asks for the OIDC token it needs itself.
permissions:
  contents: read

# The browser suite is the long pole, so a superseded run is worth cancelling rather than letting
# two of them queue against each other.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_NOLOGO: true

jobs:
  build:
    # Windows for two reasons: the SQL-backed suites need LocalDB, and the screenshot baselines were
    # rasterized here — png comparison is rasterizer-sensitive even with SSIM tolerance.
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # Keyed on everything that decides the package graph. restore-keys lets a changed graph start
      # from the previous cache rather than empty.
      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('global.json', '**/Directory.Packages.props', '**/Directory.Build.props', '**/*.csproj', '**/*.fsproj') }}
          restore-keys: nuget-${{ runner.os }}-

      # Fails here, naming the reason, rather than fifty tests later as a connection timeout.
      - name: Check LocalDB
        shell: pwsh
        run: |
          $info = sqllocaldb info
          if ($LASTEXITCODE -ne 0) {
            throw "SQL Server LocalDB is not on this image. Scry.Tests and IntegrationTests need it (EfLocalDb)."
          }
          $info

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~\AppData\Local\ms-playwright
          key: playwright-${{ hashFiles('samples/Directory.Packages.props') }}

      # The tag is the version: tag 1.2.3 (or v1.2.3) builds 1.2.3. Other builds use the
      # Version in src/Directory.Build.props.
      - name: Resolve the version from the tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: echo "VERSION_ARGUMENT=-p:Version=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      # This is the pack. ProjectDefaults packs the src projects on any Release build, so the
      # packages land in nugets/ from the build itself — which is also why the version is passed
      # here and nowhere else.
      #
      # One tree at a time, and never two at once: they share the src projects' obj directories, and
      # the global usings most files rely on are materialized there by ProjectDefaults' contentFiles.
      # A concurrent build deletes that Usings.cs without regenerating it. See CLAUDE.md.
      - name: Build src
        run: dotnet build src/Scry.slnx -c Release ${{ env.VERSION_ARGUMENT }}
      # These two carry no version because they pack nothing — the nupkgs are already written by the
      # step above, so rebuilding the src assemblies underneath them cannot reach inside one.
      - name: Build integration tests
        run: dotnet build IntegrationTests/IntegrationTests.slnx -c Release -p:GeneratePackageOnBuild=false
      - name: Build samples
        id: build
        run: dotnet build samples/Scry.Samples.slnx -c Release -p:GeneratePackageOnBuild=false

      # Every suite runs even when an earlier one fails, so one failure does not hide the others'
      # results — and the job still fails, because a failed step keeps its outcome. Gated on the
      # builds rather than on !cancelled() alone: a broken build would otherwise reach these and fail
      # again, less legibly, three more times.
      - name: Test src
        run: dotnet test src/Scry.slnx -c Release --no-build --logger trx
      - name: Test integration
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: dotnet test IntegrationTests/IntegrationTests.slnx -c Release --no-build --logger trx
      # Includes the headless-browser tests; VerifyPlaywright.Initialize(installPlaywright: true)
      # fetches Chromium on a cache miss.
      # NumberOfTestWorkers overrides the assembly's LevelOfParallelism(8), which is tuned for a
      # developer machine: what a running test costs here is a booted WASM runtime, so the ceiling is
      # memory rather than cores, and eight of them on a four-core agent starves the suite into
      # 30-second navigation timeouts rather than failing outright.
      - name: Test samples
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: dotnet test samples/Scry.Samples.slnx -c Release --no-build --logger trx -- NUnit.NumberOfTestWorkers=4

      - name: Upload test results
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: '**/*.trx'
          if-no-files-found: ignore

      # What a snapshot or screenshot failure produced, so a baseline can be compared against the run
      # that rejected it rather than reproduced locally first.
      - name: Upload received on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: received
          path: '**/*.received.*'
          if-no-files-found: ignore
          retention-days: 14

      # Kept even when a suite failed: being able to look at the packages is half of working out why
      # they were not published. The publish job only runs when this job succeeded.
      - name: Upload packages
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: nupkgs
          path: nugets/*.nupkg
          if-no-files-found: warn
          retention-days: 30

  # Trusted publishing: no stored API key. nuget.org validates GitHub's OIDC token against the
  # policy naming this repository and this workflow file, and returns a key good for an hour.
  publish:
    needs: build
    environment: nuget
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          name: nupkgs
          path: packages

      - name: NuGet login
        id: login
        uses: NuGet/login@v1
        with:
          user: SimonCropp

      - name: Push to nuget.org
        run: >
          dotnet nuget push "packages/**/*.nupkg"
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
